<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <article class="product-card">
        <img
          src="https://images.splitshire.com/full/The-Floating-Nike-Sneaker-with-Purple-Highlights_Yvntu.png"
          alt="A side view of a Nike running shoe with purple highlights"
        />
        <div>
          <h2>Nike Running Shoe</h2>
          <p>
            Crossing hardwood comfort with off-court flair. 80s-inspired
            construction, bold details and nothin'-but-net style.
          </p>
          <div>
            <div class="price">
              <span>Price</span>
              <span>$69.99</span>
            </div>
            <button class="me" type="button">Add to Cart</button>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
